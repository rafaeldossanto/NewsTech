<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fontes · NewsTech admin</title>
	<!--
		Estilo deliberadamente cru e inline: a identidade visual do portal e decisao
		da fase 3 e nao deve nascer improvisada aqui. Isto e ferramenta de operacao.
	-->
	<style>
		:root { color-scheme: light dark; }
		body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; line-height: 1.5; }
		header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
		h1 { font-size: 1.4rem; margin: 0 0 1.5rem; }
		h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; opacity: .6; margin: 2.5rem 0 .75rem; }
		.stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
		.stat { border: 1px solid currentColor; border-radius: 6px; padding: .5rem .9rem; opacity: .85; }
		.stat b { display: block; font-size: 1.3rem; }
		.stat span { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
		.flash { padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; border: 1px solid currentColor; }
		.flash.error { color: #b3261e; }
		.wrap { overflow-x: auto; }
		table { border-collapse: collapse; width: 100%; font-size: .9rem; }
		th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid rgba(128,128,128,.35); vertical-align: top; }
		th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; opacity: .65; }
		tr.inactive { opacity: .45; }
		td.url { max-width: 22rem; word-break: break-all; font-size: .8rem; opacity: .8; }
		td.note { max-width: 24rem; font-size: .8rem; opacity: .75; }
		.badge { font-size: .7rem; padding: .1rem .45rem; border: 1px solid currentColor; border-radius: 99px; }
		.fail { color: #b3261e; font-weight: 600; }
		form.inline { display: inline; }
		button { font: inherit; padding: .25rem .6rem; cursor: pointer; border-radius: 5px; border: 1px solid currentColor; background: transparent; color: inherit; }
		fieldset { border: 1px solid rgba(128,128,128,.4); border-radius: 8px; padding: 1rem; }
		fieldset div { display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end; }
		label { display: flex; flex-direction: column; font-size: .8rem; gap: .2rem; }
		input, select { font: inherit; padding: .35rem .5rem; border-radius: 5px; border: 1px solid rgba(128,128,128,.6); background: transparent; color: inherit; }
	</style>
</head>
<body>

<header>
	<h1>NewsTech · fontes</h1>
	<form th:action="@{/logout}" method="post"><button type="submit">Sair</button></form>
</header>

<div th:if="${message}" class="flash" th:text="${message}"></div>
<div th:if="${error}" class="flash error" th:text="${error}"></div>

<h2>Fila do pipeline</h2>
<div class="stats">
	<div class="stat"><b th:text="${stats.collected}">0</b><span>a triar</span></div>
	<div class="stat"><b th:text="${stats.triaged}">0</b><span>triados</span></div>
	<div class="stat"><b th:text="${stats.discarded}">0</b><span>descartados</span></div>
	<div class="stat"><b th:text="${stats.published}">0</b><span>publicados</span></div>
	<div class="stat"><b th:text="${stats.needsReview}">0</b><span>p/ revisar</span></div>
</div>

<h2 th:text="'Fontes (' + ${#lists.size(sources)} + ')'">Fontes</h2>
<div class="wrap">
<table>
	<thead>
	<tr>
		<th>Fonte</th><th>Peso</th><th>Feed</th><th>Última coleta</th><th>Falhas</th><th>Observação</th><th></th>
	</tr>
	</thead>
	<tbody>
	<tr th:each="s : ${sources}" th:classappend="${s.active} ? '' : 'inactive'">
		<td>
			<span th:text="${s.name}">Nome</span><br>
			<span class="badge" th:text="${s.connectorType}">RSS</span>
			<span class="badge" th:text="${s.active} ? 'ativa' : 'inativa'">ativa</span>
		</td>
		<td th:text="${s.trustWeight}">50</td>
		<td class="url" th:text="${s.feedUrl}">url</td>
		<td th:text="${s.lastFetchedAt} ?: '—'">—</td>
		<td>
			<span th:if="${s.consecutiveFailures > 0}" class="fail" th:text="${s.consecutiveFailures}">0</span>
			<span th:unless="${s.consecutiveFailures > 0}">—</span>
			<div th:if="${s.nextAttemptAt}" style="font-size:.7rem;opacity:.7">
				retoma <span th:text="${s.nextAttemptAt}"></span>
			</div>
		</td>
		<td class="note" th:text="${s.note} ?: ''"></td>
		<td style="white-space:nowrap">
			<form class="inline" th:action="@{'/admin/sources/' + ${s.id} + '/collect'}" method="post">
				<button type="submit">Coletar</button>
			</form>
			<form class="inline" th:action="@{'/admin/sources/' + ${s.id} + '/toggle'}" method="post">
				<button type="submit" th:text="${s.active} ? 'Desativar' : 'Ativar'">Desativar</button>
			</form>
		</td>
	</tr>
	</tbody>
</table>
</div>

<h2>Cadastrar fonte</h2>
<form th:action="@{/admin/sources}" method="post">
	<fieldset>
		<div>
			<label>Nome <input type="text" name="name" required></label>
			<label>URL do feed <input type="url" name="feedUrl" required size="42"></label>
			<label>Conector
				<select name="connectorType">
					<option th:each="t : ${connectorTypes}" th:value="${t}" th:text="${t}"></option>
				</select>
			</label>
			<label>Peso <input type="number" name="trustWeight" value="50" min="0" max="100"></label>
			<button type="submit">Cadastrar</button>
		</div>
	</fieldset>
</form>

</body>
</html>
