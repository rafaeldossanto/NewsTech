<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
	Página de cards devolvida ao "carregar mais". Usa o mesmo fragmento da primeira
	renderização, então a página 2 sai idêntica à página 1 — sem um segundo caminho
	de montagem que possa divergir com o tempo.

	Lê `entries` direto do model, sem parâmetro: quando o fragmento é devolvido como
	view name pelo controller, o Thymeleaf exige parâmetro nomeado na assinatura.
-->
<th:block th:fragment="page">
	<th:block th:each="entry : ${entries}">
		<div th:replace="~{fragments/feed :: cardItem(${entry})}"></div>
	</th:block>
</th:block>

</body>
</html>
