<!DOCTYPE html>
<html lang="pt-BR"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title layout:title-pattern="$CONTENT_TITLE · NewsTech">NewsTech</title>
	<meta name="description" th:content="${pageDescription} ?: 'O que aconteceu em tecnologia, sem o ruído. IA, linguagens de programação e as empresas do setor.'">
	<link rel="stylesheet" th:href="@{/css/newstech.css}">
	<script>
		// Aplicado antes da pintura para nao piscar o tema claro em quem usa escuro.
		(function () {
			var saved = null;
			try { saved = localStorage.getItem('newstech-theme'); } catch (e) { /* modo restrito */ }
			if (saved) { document.documentElement.setAttribute('data-theme', saved); }
		})();
	</script>
</head>
<body>

<header class="site-header">
	<div class="shell bar">
		<a class="wordmark" th:href="@{/}">News<em>Tech</em></a>

		<nav class="site-nav" th:if="${navTopics}">
			<a th:each="t : ${navTopics}"
			   th:href="@{'/' + ${t.slug}}"
			   th:text="${t.name}"
			   th:classappend="${t.slug == activeTopic} ? 'on' : ''">Tópico</a>
		</nav>

		<div class="header-actions">
			<th:block sec:authorize="isAuthenticated()">
				<a class="header-link" th:href="@{/escrever}">escrever</a>
				<form th:action="@{/logout}" method="post" class="inline-form">
					<button class="header-link" type="submit">sair</button>
				</form>
			</th:block>
			<a class="header-link" th:href="@{/entrar}" sec:authorize="!isAuthenticated()">entrar</a>
			<button class="theme-toggle" type="button" id="themeToggle" aria-label="Alternar tema claro e escuro">tema</button>
			<!-- O rotulo vira "claro"/"escuro" no script do rodape, quando o tema efetivo e conhecido. -->
		</div>
	</div>
</header>

<main class="shell">
	<div layout:fragment="content">conteúdo</div>
</main>

<footer class="site-footer">
	<div class="shell">
		<p>
			NewsTech agrega manchetes de tecnologia e publica resumos próprios com link e crédito
			à fonte original. O texto integral pertence a quem o publicou — para ler a matéria
			completa, siga sempre o link da fonte.
		</p>
		<p><a th:href="@{/}">início</a> · <a th:href="@{/admin/sources}">admin</a></p>
	</div>
</footer>

<script>
	(function () {
		var toggle = document.getElementById('themeToggle');
		if (!toggle) { return; }

		var sistemaEscuro = window.matchMedia('(prefers-color-scheme: dark)');

		// Sem escolha salva o tema e o que o sistema pede - nao ha atributo para ler.
		function temaAtual() {
			var escolhido = document.documentElement.getAttribute('data-theme');
			if (escolhido) { return escolhido; }
			return sistemaEscuro.matches ? 'dark' : 'light';
		}

		// O botao nomeia o destino, nao o estado: no escuro ele oferece "claro".
		function rotular() {
			var destino = temaAtual() === 'dark' ? 'claro' : 'escuro';
			toggle.textContent = destino;
			toggle.setAttribute('aria-label', 'Mudar para o tema ' + destino);
		}

		toggle.addEventListener('click', function () {
			var proximo = temaAtual() === 'dark' ? 'light' : 'dark';
			document.documentElement.setAttribute('data-theme', proximo);
			try { localStorage.setItem('newstech-theme', proximo); } catch (e) { /* modo restrito */ }
			rotular();
		});

		// Enquanto o leitor nao escolher, o tema segue o sistema: o rotulo tem que acompanhar.
		sistemaEscuro.addEventListener('change', rotular);

		rotular();
	})();
</script>

<!-- Ponto de extensao para o script proprio de cada pagina. -->
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
