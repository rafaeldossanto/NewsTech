<!DOCTYPE html>
<html lang="pt-BR"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/base}">
<head>
	<title th:text="${pageTitle}">Artigos</title>
</head>
<body>

<div layout:fragment="content">

	<header class="page-head">
		<div class="kicker">Assinados</div>
		<h1>Artigos</h1>
		<p>
			Textos escritos por pessoas, com assinatura. Diferente das peças da home, que são
			resumos de notícias com crédito à fonte original.
		</p>
		<p style="margin-top:.8rem">
			<a class="header-link" th:href="@{/escrever}" sec:authorize="isAuthenticated()">escrever um artigo</a>
			<a class="header-link" th:href="@{/cadastro}" sec:authorize="!isAuthenticated()">criar conta para escrever</a>
		</p>
	</header>

	<div class="grid" th:if="${!articles.isEmpty()}">
		<th:block th:each="a : ${articles}">
			<div th:replace="~{fragments/feed :: card(${a})}"></div>
		</th:block>
	</div>

	<p class="empty" th:if="${articles.isEmpty()}">
		Nenhum artigo publicado ainda. Que tal ser o primeiro?
	</p>

</div>

</body>
</html>
