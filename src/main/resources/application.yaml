spring:
  application:
    name: newstech
  profiles:
    default: dev
  data:
    mongodb:
      # Indices sao criados explicitamente no MongoBootstrap, com nome e opcoes sob controle.
      # auto-index-creation cria indice a partir de anotacao, sem controle de nome nem de TTL.
      auto-index-creation: false
  threads:
    virtual:
      # A carga e I/O-bound: dezenas de fetches de feed em paralelo.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

newstech:
  mongo:
    # Retencao da materia-prima do pipeline, aplicada como indice TTL em rawItems.fetchedAt.
    # Nao e arquivo publico: e insumo. A retencao limitada faz parte do desenho juridico do projeto.
    raw-item-retention-days: 90

  ingest:
    # Identifica o bot para quem opera as fontes, com um canal de contato.
    user-agent: 'NewsTechBot/0.1 (+https://newstech.example/bot)'
    fetch-timeout-seconds: 20
    max-items-per-fetch: 50
    interval: PT10M
    backoff-base-minutes: 10
    backoff-max-hours: 6

  claude:
    triage-model: claude-haiku-4-5
    # Inclui thinking + resposta.
    triage-max-tokens: 2048
    # Corte inicial. Calibrar lendo os descartados antes de mexer.
    relevance-threshold: 40
    triage-batch-size: 25
    editorial-model: claude-opus-5
    # Inclui thinking + resposta.
    editorial-max-tokens: 16000
    editorial-batch-size: 10

    # ATENCAO: os dois agendadores abaixo sao os unicos que gastam dinheiro.
    # Ligar so depois de configurar o limite de gasto no console da Anthropic.
    auto-triage: false
    auto-editorial: false
    triage-interval: PT15M
    editorial-interval: PT20M

  # Dolares por milhao de tokens. Leitura de cache custa 10% do input.
  pricing:
    claude-haiku-4-5:
      input-per-million: 1.00
      output-per-million: 5.00
      cached-input-per-million: 0.10
    claude-opus-5:
      input-per-million: 5.00
      output-per-million: 25.00
      cached-input-per-million: 0.50

  authoring:
    publish-window: PT24H
    quarantine-articles: 3
    max-title-length: 120

  cluster:
    window-hours: 48
    # Os clusters reais do primeiro lote pontuaram entre 0,36 e 0,60; pares de assuntos
    # apenas parecidos ficaram abaixo de 0,25. 0,30 separa os dois grupos com folga.
    threshold: 0.30
